name = "advisor-api"
main = "worker.js"
compatibility_date = "2026-10-19"
# Deployed via Cloudflare Workers Builds from GitHub

# Keep the LEADS KV binding in sync with the Cloudflare dashboard
[[kv_namespaces]]
binding = "LEADS"
id = "1ed2126e01ef4891be0ce12890136b03"

# Pack AcademyB2Video (2026-11-10): the Academy HLS media store is the
# PRIVATE Backblaze B2 bucket 'eh-realty-academy-videos' (S3 endpoint
# s3.ca-east-006.backblazeb2.com), reached from worker.js over the
# S3-compatible API with worker-side SigV4 — NO binding exists or is
# needed; credentials live in KV cfg:b2 (one-shot bearer-carried
# provision). The Pack AcademyR2Video R2 binding that used to sit here
# was REMOVED (never uncommented, never provisioned: R2 activation on
# this account demands a payment method). Record:
# hidden_files/pack-academy-b2-video-build-2026-11-10.md.

# Service bindings: worker-to-worker calls (public fetch between *.workers.dev is blocked at the edge, error 1042)
[[services]]
binding = "SELLER"
service = "seller-api"

[[services]]
binding = "NEWSLETTER"
service = "newsletter-signup"

[[services]]
binding = "AICHAT"
service = "ai-chat"

# Pack UsageAlertNative (2026-11-13): the second expression is the
# native usage watchdog (hourly at :07 UTC). scheduled() dispatches
# on event.cron: "7 * * * *" runs ONLY the watchdog; the nightly
# expression below never runs it.
# Nightly automatic whole-site backup (worker scheduled handler;
# 09:00 UTC = 01:00 PST / 02:00 PDT). The handler itself date-gates:
# no backup is taken before 2026-12-01.
[triggers]
crons = ["0 9 * * *", "7 * * * *"]
